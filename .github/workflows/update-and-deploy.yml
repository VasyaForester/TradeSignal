name: Update market data and deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # Every 2 hours in Moscow trading window (09-23).
    - cron: "17 6,8,10,12,14,16,18,20 * * 1-5"

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build fresh market snapshot
        run: python scripts/update_data.py

      - name: Validate snapshot
        run: python -m unittest discover -s tests -v

      - name: Assemble static site
        run: |
          mkdir _site
          cp index.html styles.css app.js _site/
          mkdir _site/data
          cp data/market-data.json _site/data/

      # Publish via gh-pages branch. Repo Pages source must be:
      # Settings → Pages → Deploy from a branch → gh-pages / (root)
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
