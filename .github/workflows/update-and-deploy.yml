name: Update market data and deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # Every 2 hours in Moscow trading window (09-23).
    - cron: "17 6,8,10,12,14,16,18,20 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build fresh market snapshot
        run: python scripts/update_data.py

      - name: Validate snapshot
        run: python -m unittest discover -s tests -v

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble static site
        run: |
          mkdir _site
          cp index.html styles.css app.js _site/
          mkdir _site/data
          cp data/market-data.json _site/data/
          touch _site/.nojekyll

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
