name: Update market data and deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # Every 30 minutes from 09:17 to 23:47 Moscow time on trading weekdays.
    - cron: "17,47 6-20 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build fresh market snapshot
        run: python scripts/update_data.py

      - name: Validate snapshot
        run: python -m unittest discover -s tests -v

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble static site
        run: |
          mkdir _site
          cp index.html styles.css app.js _site/
          mkdir _site/data
          cp data/market-data.json _site/data/

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: update
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
